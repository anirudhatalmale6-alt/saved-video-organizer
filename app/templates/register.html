{% extends "base.html" %}
{% block title %}Create account{% endblock %}
{% block body %}
<div class="authwrap">
  <form class="authcard" method="post">
    <div class="brand big"><span class="brand-mark"></span> Saved Organizer</div>
    <p class="sub">
      {% if first_run %}This is the first account on this instance &mdash; it owns the library.
      {% else %}Create an account.{% endif %}
    </p>
    <label>Email
      <input type="email" name="email" required autofocus autocomplete="username">
    </label>
    <label>Password <span class="sub">at least 8 characters</span>
      <input type="password" name="password" required minlength="8" autocomplete="new-password">
    </label>
    <label>Confirm password
      <input type="password" name="confirm" required minlength="8" autocomplete="new-password">
    </label>
    <button type="submit">Create account</button>
    <p class="sub center"><a href="{{ url_for('auth.login') }}">Back to sign in</a></p>
  </form>
</div>
{% endblock %}
